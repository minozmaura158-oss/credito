    <title>División y Carrusel</title>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDFYJf5HrCfbyEkggIHJ6hcgQJpUKMfzc0",
        authDomain: "basedtos-84767.firebaseapp.com",
        projectId: "basedtos-84767",
        storageBucket: "basedtos-84767.appspot.com",
        messagingSenderId: "622608516389",
        appId: "1:622608516389:web:b3c12b4a3537c1bfff06cc",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db; // Hacer db accesible globalmente
      window.doc = doc;
      window.setDoc = setDoc;
      window.onSnapshot = onSnapshot;
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
        padding: 0;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        height: 100vh;
      }

      .left,
      .right {
        padding: 20px;
      }

      .left {
        flex: 1;
        background-color: #ffffff;
        order: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .right {
        flex: 1.5;
        background-color: #f6faff;
        order: 2;
      }

      /* Estilo del contenedor del carrusel */
      .carousel-wrapper {
        width: 500px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }

      /* Estilo del carrusel */
      .carousel {
        display: flex;
        gap: 10px;
        overflow: hidden;
        width: 100%;
        scroll-behavior: smooth;
      }

      .carousel-item {
        min-width: calc(33.33% - 20px);
        height: 200px;

        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        border-radius: 5px;
      }

      button {
        background-color: rgb(255, 255, 255);
        color: #0043a9;
        border: none;
        padding: 10px;
        border-radius: 100%;
        border: 1px solid #0043a9;
        width: 40px;
        cursor: pointer;
      }

      .prev,
      .next {
        flex: 0 0 auto;
      }
      .formulario {
        width: 400px;
      }

      .formcontainer {
        width: 100%;
        max-width: 600px;

        height: 100vh;
        margin: 0 auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        background-color: #ffffff;
        border: 1px solid #e6e6e6;
        border-radius: 10px 10px 0 0;
      }

      .tab {
        flex: 1;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        color: gray;
      }
      .active {
        color: #0043a9;
        border-bottom: 1px solid #0043a9;
      }

      .forms {
        padding: 20px;
        border: 1px solid #e6e6e6;
        background-color: #ffffff;
      }

      .form-content {
        display: none;
      }

      .form-content h3 {
        margin-top: 0;
      }

      #form1 {
        display: block;
        box-sizing: border-box;
      }
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          height: auto;
        }

        .right {
          order: 2 !important;
          width: 100%;
          height: auto; /* Ajusta la altura automáticamente */
        }

        .left {
          order: 1;
          width: 100%;
        }

        .formulario {
          width: 100%;
        }

        .carousel-wrapper {
          width: 100%;
        }

        .carousel-item {
          min-width: 38%;
        }
        .centrars {
          margin-top: 10%;
        }
      }
      @media (min-width: 768px) {
        .cabeza {
          display: none;
        }
      }
    </style>
  </head>
  <body style="background: #f6f9fe">

    <script>
      function showForm(formId, element) {
        // Ocultar todos los formularios
        document.querySelectorAll(".form-content").forEach(function (form) {
          form.style.display = "none";
        });

        // Mostrar el formulario seleccionado
        document.getElementById(formId).style.display = "inline";

        // Remover la clase activa de todas las pestañas
        document.querySelectorAll(".tab").forEach(function (tab) {
          tab.classList.remove("active");
        });

        // Agregar la clase activa a la pestaña seleccionada
        element.classList.add("active");
      }
    </script>
    <script src="script.js"></script>
  </body>
